  const re = new RegExp("(^|[^a-zà-ÿ])(" + list.join("|") + ")(?![a-zà-ÿ])", "i");
  const m = str.match(re);
  if (!m) return null;
  const start = m.index + m[1].length;
  return { word: m[2].toLowerCase(), start, end: start + m[2].length };
}

function detectHeader(text) {
  const out = { date: null, nextDay: false };
  (text || "").split(/\r?\n/).forEach((ln) => {
    if (/europal|pallet|palete/i.test(ln)) return;
    if (/available|dispon/i.test(ln)) {
      const m = ln.match(/(\d{1,2})[./](\d{1,2})[./](\d{4})/);
      if (m && !out.date) out.date = isoFromParts(m[1], m[2], m[3]);
      if (/next\s*day|tomorrow|amanh|dia seguinte/i.test(ln)) out.nextDay = true;
    }
  });
  return out;
}

function extractDate(s, base) {

  dm = s.match(/(\d{1,2})[./](\d{1,2})[./](\d{4}|\d{2})(?!\d)/);
  if (dm) {
    const iso = isoFromParts(dm[1], dm[2], dm[3]);
    if (iso) { from = to = iso; s = s.replace(dm[0], " "); }
  }
  if (!from) {
    dm = s.match(/(^|[^\d])(\d{1,2})[./](\d{1,2})(?![\d./])/);
    if (dm) {
      const iso = isoFromParts(dm[2], dm[3], base.slice(0, 4));
      if (iso) { from = to = iso; s = s.replace(dm[0], dm[1] + " "); }
    }
  }
  if (!from) {

    if (w) { from = to = addDaysISO(base, 1); s = cutRange(s, w.start, w.end); }
  }
  if (!from) {
    const w = findWord(s, ["today", "hoje", "heute"]);
    if (w) { from = to = base; s = cutRange(s, w.start, w.end); }
  }
  if (!from) {
    const all = [];
    WEEKDAY_WORDS.forEach((names, idx) => names.forEach((n) => all.push([n, idx])));
    const w = findWord(s, all.map((x) => x[0]));
